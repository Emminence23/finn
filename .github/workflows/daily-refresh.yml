name: Daily refresh
# Every morning: fetch new NSE filings and screener figures, enrich only the new filings
# (rules first; the free model reads what rules can't settle; results cards come from
# screener when it has the quarter), commit the fixtures. The push redeploys Render, whose
# image seeds its database from these fixtures.
on:
  schedule:
    - cron: "30 1 * * *"  # 07:00 IST, before the market opens
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: daily-refresh, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: {run: {working-directory: backend}}
    env:
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      # each source may fail on its own (NSE blocks some cloud IPs); the stored copy stays
      - run: uv run --no-dev python -m app.ingest.snapshot announcements || true
      - run: uv run --no-dev python -m app.ingest.snapshot fundamentals || true
      - run: uv run --no-dev python -m app.ingest.snapshot prices || true
      - run: uv run --no-dev python -m app.ingest.seed
      - run: uv run --no-dev python -m app.intel.enrich
      - name: Commit fixtures if anything changed
        run: |
          git config user.name "finn-refresh"
          git config user.email "finn-refresh@users.noreply.github.com"
          git add data/fixtures
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit -m "chore(data): daily refresh $(date -u +%F)"
          git push
