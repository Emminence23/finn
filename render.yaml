# Render blueprint: FastAPI backend on the free plan. Frontend deploys to Vercel separately.
services:
  - type: web
    name: finn-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_FALLBACK # a second Google project's key, used after the first's free quota
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINN_DEMO_PASSCODE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FINN_MAX_LIVE_BUILDS_PER_DAY
        value: "20"
      - key: FINN_MAX_QUESTIONS_PER_DAY
        value: "60"
