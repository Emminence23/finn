# Task-based LLM routing (REQUIREMENTS.md §6.2). Swap providers here; no code change needed.
# provider: gemini | groq | openrouter | ollama | anthropic
default_provider: gemini

tasks:
  classify_filing:     {tier: fast}
  summarise_filing:    {tier: fast}
  extract_results:     {tier: fast}
  extract_person:      {tier: fast}
  extract_guidance:    {tier: fast}
  business_snapshot:   {tier: mid}
  bull_bear:           {tier: mid}
  promise_vs_delivery: {tier: strong}

# Model per provider per tier. Gemini IDs verified against this key's free tier on 2026-11-16
# (`uv run python -m app.llm.cli models gemini` + a ping per model). Override per tier via
# LLM_MODEL_<PROVIDER>_<TIER>.
providers:
  gemini:     {fast: gemini-3.5-flash-lite, mid: gemini-3.5-flash, strong: gemini-4-hydrogen}
  groq:       {fast: TBD, mid: TBD, strong: TBD}
  anthropic:  {fast: claude-haiku-5-5, mid: claude-sonnet-5-5, strong: claude-opus-5-5}

# USD per 1M tokens, used for the /admin/costs report. Free tiers cost 0.
pricing:
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5:   {input: 4.00, output: 20.00}
