# Task-based LLM routing (REQUIREMENTS.md §6.2). Swap providers here; no code change needed.
# provider: gemini | groq | openrouter | ollama | anthropic
default_provider: gemini

tasks:
  triage_filings:      {tier: fast}
  classify_filing:     {tier: fast}
  summarise_filing:    {tier: fast}
  extract_results:     {tier: fast}
  extract_person:      {tier: fast}
  extract_guidance:    {tier: mid}
  business_snapshot:   {tier: mid}
  bull_bear:           {tier: mid}
  answer_question:     {tier: mid}     # Ask FINN: grounded Q&A over one company
  plan_question:       {tier: fast}    # Ask: picks a report and tickers when code's rules can't (no data sent)
  portfolio_review:    {tier: mid}     # nudges code's suggested weights from filings, ±2 pts
  extract_brokerage:   {tier: mid}     # brokerage report -> observation; code verifies every quote
  explain_divergence:  {tier: mid}     # why brokerages disagree, numbers checked in code
  # The hero verdicts must not silently degrade to a lite model: fail (keep the fixture) instead.
  promise_vs_delivery: {tier: strong, fallbacks: {gemini: [gemini-3.5-flash]}}

# Model per provider per tier. Gemini IDs verified against this key's free tier on 2026-11-16
# (`uv run python -m app.llm.cli models gemini` + a ping per model). Override per tier via
# LLM_MODEL_<PROVIDER>_<TIER>.
providers:
  gemini:     {fast: gemini-3.5-flash-lite, mid: gemini-3.5-flash, strong: gemini-4-hydrogen}
  groq:       {fast: TBD, mid: TBD, strong: TBD}
  anthropic:  {fast: claude-haiku-5-5, mid: claude-sonnet-5-5, strong: claude-opus-5-5}

# USD per 1M tokens, used for the /admin/costs report. Free tiers cost 0.
pricing:
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5:   {input: 4.00, output: 20.00}

# Used in order only when a model's quota is exhausted (free tiers have small daily limits).
# Every fallback must support schema-constrained JSON (Gemma on the Gemini API does not).
fallbacks:
  gemini:
    fast:   [gemini-3.1-flash-lite, gemini-2.5-flash-lite]
    mid:    [gemini-4-hydrogen, gemini-3.1-flash-lite]
    strong: [gemini-3.5-flash, gemini-3.1-flash-lite]
