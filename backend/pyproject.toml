[project]
name = "finn-backend"
version = "0.1.0"
description = "FINN backend: data ingest, intelligence pipeline and API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.8.0",
]



[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
